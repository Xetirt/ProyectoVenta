<!DOCTYPE html><html lang="es"><head>
  <script src="js/theme-bootstrap.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n-title="profile.title"></title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head>
<body><div class="app-layout"><aside id="app-sidebar" class="sidebar"></aside><div class="app-content"><header id="app-topbar" class="app-topbar"></header><main class="private-main"><div class="app-head"><div><div class="page-eyebrow" data-i18n="profile.eyebrow"></div><h1 data-i18n="profile.title"></h1><p data-i18n="profile.subtitle"></p></div></div>
<section class="dash-grid"><div class="card editor-card"><div class="section-title"><h2 data-i18n="profile.profile"></h2></div><form id="profile-form"><div class="form-group"><label for="profile-company" data-i18n="settings.company"></label><input id="profile-company" class="form-control" required></div><div class="form-group"><label for="profile-tax" data-i18n="settings.taxId"></label><input id="profile-tax" class="form-control" required></div><div class="form-group"><label for="profile-type" data-i18n="profile.businessType"></label><select id="profile-type" class="form-control"><option value="autonomo" data-i18n-option="auth.autonomo"></option><option value="sociedad" data-i18n-option="auth.companyType"></option><option value="otro" data-i18n-option="auth.other"></option></select></div><button class="btn-primary" type="submit" data-i18n="profile.save"></button></form></div>
<div class="card editor-card"><div class="section-title"><h2 data-i18n="profile.membership"></h2><span id="sub-badge" class="badge"></span></div><ul class="summary-list" id="subscription-details"></ul><div class="btn-row" style="margin-top:1rem"><a href="checkout.html" id="manage-sub" class="btn-primary" data-i18n="profile.manage"></a><button id="cancel-sub" class="btn-ghost" type="button" data-i18n="profile.cancel"></button></div></div></section>
</main></div></div><script type="module" src="js/main.js"></script><script type="module" src="js/perfil.js"></script>
</body></html>
