<!DOCTYPE html><html lang="es"><head>
<script src="js/theme-bootstrap.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"><title data-i18n-title="contracts.title"></title></head>
<body><div class="app-layout"><aside id="app-sidebar" class="sidebar"></aside><div class="app-content"><header id="app-topbar" class="app-topbar"></header><main class="private-main phase6-main">
<div class="app-head"><div><div class="page-eyebrow" data-i18n="contracts.eyebrow"></div><h1 data-i18n="contracts.title"></h1><p data-i18n="contracts.subtitle"></p></div><span id="contracts-plan" class="badge badge-neutral"></span></div>
<section class="feature-grid contract-layout"><div class="card editor-card"><form id="contract-form"><div class="form-grid-2"><div class="form-group"><label for="contract-template" data-i18n="contracts.template"></label><select id="contract-template" class="form-control"><option value="standard" data-i18n="contracts.standard"></option><option value="web" data-i18n="contracts.web"></option><option value="maintenance" data-i18n="contracts.maintenance"></option><option value="consulting" data-i18n="contracts.consulting"></option></select></div><div class="form-group"><label for="contract-client" data-i18n="contracts.client"></label><select id="contract-client" class="form-control"><option value="" data-i18n="contracts.selectClient"></option></select></div></div><div class="form-grid-2"><div class="form-group"><label for="contract-quote" data-i18n="contracts.quote"></label><select id="contract-quote" class="form-control"></select></div><div class="form-group"><label for="contract-date" data-i18n="contracts.date"></label><input id="contract-date" class="form-control" type="date"></div></div><div class="form-group"><label for="contract-duration" data-i18n="contracts.duration"></label><input id="contract-duration" class="form-control" value="12 meses"></div><div class="form-group" id="contract-clauses-wrap"><label for="contract-clauses" data-i18n="contracts.clauses"></label><textarea id="contract-clauses" class="form-control" rows="5"></textarea><small class="input-hint" id="contract-advanced-note" data-i18n="contracts.advancedLocked"></small></div><div class="btn-row"><button id="contract-generate" class="btn-primary" type="submit" data-i18n="contracts.generate"></button><button id="contract-print" class="btn-ghost" type="button" data-i18n="contracts.print"></button><button id="contract-download" class="btn-ghost" type="button" data-i18n="contracts.download"></button></div></form></div>
<div class="card contract-preview-card"><div class="section-title"><h2 data-i18n="contracts.body"></h2><span class="badge badge-neutral" id="contract-preview-label">Borrador</span></div><article id="contract-preview" class="contract-document"></article></div></section></main></div></div><script type="module" src="js/main.js"></script><script type="module" src="js/contratos.js"></script></body></html>
