<!DOCTYPE html><html lang="es"><head>
  <script src="js/theme-bootstrap.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n-title="inventory.title"></title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head>
<body><div class="app-layout"><aside id="app-sidebar" class="sidebar"></aside><div class="app-content"><header id="app-topbar" class="app-topbar"></header><main class="private-main">
<div class="app-head"><div><div class="page-eyebrow" data-i18n="inventory.eyebrow"></div><h1 data-i18n="inventory.title"></h1><p data-i18n="inventory.subtitle"></p></div></div>
<section class="kpi-grid"><div class="card"><div class="kpi-label" data-i18n="inventory.value"></div><div class="kpi-value" id="stock-valor-total">0,00 €</div></div><div class="card"><div class="kpi-label" data-i18n="inventory.units"></div><div class="kpi-value" id="stock-total-unidades">0</div></div><div class="card"><div class="kpi-label" data-i18n="inventory.alerts"></div><div class="kpi-value" id="stock-alertas-count">0</div></div></section>
<section class="editor-grid"><div class="card editor-card"><div class="section-title"><h2 id="stock-form-title" data-i18n="inventory.add"></h2></div><form id="form-stock"><div class="form-group"><label for="prod-nombre" data-i18n="inventory.name"></label><input id="prod-nombre" class="input-field" required></div><div class="form-grid-2"><div class="form-group"><label for="prod-sku" data-i18n="inventory.sku"></label><input id="prod-sku" class="input-field" required></div><div class="form-group"><label for="prod-precio" data-i18n="inventory.unitPrice"></label><input id="prod-precio" type="number" min="0" step="0.01" class="input-field" required></div></div><div class="form-grid-2"><div class="form-group"><label for="prod-cantidad" data-i18n="inventory.quantity"></label><input id="prod-cantidad" type="number" min="0" step="1" class="input-field" required></div><div class="form-group"><label for="prod-minimo" data-i18n="inventory.min"></label><input id="prod-minimo" type="number" min="0" step="1" value="5" class="input-field" required></div></div><div class="form-group"><label for="prod-iva" data-i18n="billing.tax"></label><input id="prod-iva" type="number" min="0" max="100" step="0.01" value="21" class="input-field" required></div><div class="btn-row"><button id="stock-submit" class="btn-primary" type="submit" data-i18n="inventory.add"></button><button id="stock-cancel-edit" class="btn-ghost" type="button" data-i18n="inventory.cancelEdit" hidden></button></div></form></div>
<div class="card editor-card"><div class="section-title"><h2 data-i18n="inventory.title"></h2><input id="buscar-stock" class="input-field" style="max-width:260px" data-i18n-placeholder="inventory.search"></div><div class="table-container"><table class="data-table responsive-cards"><thead><tr><th data-i18n="inventory.sku"></th><th data-i18n="inventory.product"></th><th data-i18n="inventory.unitPrice"></th><th data-i18n="inventory.stock"></th><th data-i18n="inventory.status"></th><th data-i18n="inventory.actions"></th></tr></thead><tbody id="tabla-stock"></tbody></table></div></div></section>
</main></div></div><script type="module" src="js/main.js"></script><script type="module" src="js/funcionalidades.js"></script>
</body></html>
