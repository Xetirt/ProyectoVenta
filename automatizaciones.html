<!DOCTYPE html><html lang="es"><head>
<script src="js/theme-bootstrap.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"><title data-i18n-title="automation.title"></title></head>
<body><div class="app-layout"><aside id="app-sidebar" class="sidebar"></aside><div class="app-content"><header id="app-topbar" class="app-topbar"></header><main class="private-main phase6-main">
<div class="app-head"><div><div class="page-eyebrow" data-i18n="automation.eyebrow"></div><h1 data-i18n="automation.title"></h1><p data-i18n="automation.subtitle"></p></div><span class="badge badge-warning" data-i18n="automation.proOnly"></span></div>
<section id="automation-preview" class="card premium-preview"><div class="premium-preview-icon">⚡</div><div><h2 data-i18n="automation.demoTitle"></h2><p data-i18n="automation.demoText"></p></div><div class="btn-row"><button id="automation-upgrade" class="btn-primary" type="button" data-i18n="automation.upgrade"></button><button id="automation-simulate" class="btn-ghost" type="button" data-i18n="automation.previewRun"></button></div></section>
<section id="automation-workspace" class="feature-grid automation-layout" hidden><div class="card editor-card"><div class="section-title"><h2 data-i18n="automation.rule"></h2></div><form id="automation-form"><div class="form-group"><label for="automation-type" data-i18n="automation.rule"></label><select id="automation-type" class="form-control"><option value="quote" data-i18n="automation.quoteReminder"></option><option value="invoice" data-i18n="automation.invoiceDue"></option></select></div><div class="form-grid-2"><div class="form-group"><label for="automation-days" data-i18n="automation.days"></label><input id="automation-days" type="number" class="form-control" min="1" max="90" value="5"></div><label class="switch-line"><input id="automation-active" type="checkbox" checked><span data-i18n="automation.active"></span></label></div><button class="btn-primary" type="submit" data-i18n="automation.save"></button></form></div><div class="card editor-card automation-alerts-card"><div class="section-title"><h2>Alertas inteligentes</h2><select id="automation-alert-filter" class="form-control" aria-label="Filtrar alertas"><option value="all">Todas</option><option value="due">Vencimientos</option><option value="clients">Clientes</option><option value="system">Sistema</option></select></div><ul id="automation-alerts" class="automation-alert-list"></ul><h3 class="automation-history-heading" data-i18n="automation.history"></h3><ul id="automation-history" class="summary-list"></ul></div></section></main></div></div><script type="module" src="js/main.js"></script><script type="module" src="js/automatizaciones.js"></script></body></html>
