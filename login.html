<!DOCTYPE html>
<html lang="es">

<head>
  <script src="js/theme-bootstrap.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="auth.login.title"></title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <header id="app-navbar"></header>

    <main style="padding: 4rem 8%; display: flex; justify-content: center; align-items: center; flex-grow: 1;">
        <div class="card" style="width: 100%; max-width: 420px;">
            <h2 style="text-align: center; font-size: 1.8rem; margin-bottom: 0.4rem;" data-i18n="auth.login.title"></h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;" data-i18n="auth.login.subtitle"></p>

            <div id="mensaje-feedback" hidden></div>
            <form id="form-login">
                <div class="form-group">
                    <label for="email" data-i18n="auth.email"></label>
                    <input type="email" id="email" required class="input-field" data-i18n-placeholder="auth.emailPlaceholder">
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="auth.password"></label>
                    <input type="password" id="password" required class="input-field" data-i18n-placeholder="auth.passwordPlaceholder">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;" data-i18n="auth.login.button"></button>
                <p style="text-align:center; margin-top:1rem; font-size:.85rem;"><a href="recuperar.html" style="color: var(--primary-color);"><span data-i18n="auth.forgot"></span></a></p>
            </form>

            <p style="text-align: center; color: var(--text-muted); margin-top: 1.5rem; font-size: 0.85rem;">
                <span data-i18n="auth.noAccount"></span> <a href="registro.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;"><span data-i18n="auth.createHere"></span></a>
            </p>
        </div>
    </main>

    <footer><p data-i18n="landing.footer"></p></footer>

    <script type="module" src="js/main.js"></script>
</body></html>
