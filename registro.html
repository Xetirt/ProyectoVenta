<!DOCTYPE html>
<html lang="es">

<head>
  <script src="js/theme-bootstrap.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="auth.register.title"></title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <header id="app-navbar"></header>

    <main style="padding: 4rem 8%; display: flex; justify-content: center; align-items: center; flex-grow: 1;">
        <div class="card" style="width: 100%; max-width: 460px;">
            <h2 style="text-align: center; font-size: 1.8rem; margin-bottom: 0.4rem;" data-i18n="auth.register.title"></h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;" data-i18n="auth.register.subtitle"></p>

            <div id="mensaje-feedback" hidden></div>
            <form id="form-registro">
                <div class="form-group">
                    <label for="empresa" data-i18n="auth.company"></label>
                    <input type="text" id="empresa" required class="input-field" data-i18n-placeholder="auth.companyPlaceholder">
                </div>
                <div class="form-group">
                    <label for="cif" data-i18n="auth.taxId"></label>
                    <input type="text" id="cif" required class="input-field" data-i18n-placeholder="auth.taxIdPlaceholder">
                </div>
                <div class="form-group">
                    <label for="perfil" data-i18n="auth.businessType"></label>
                    <select id="perfil" class="input-field">
                        <option value="autonomo" data-i18n-option="auth.autonomo"></option>
                        <option value="sociedad" data-i18n-option="auth.companyType"></option>
                        <option value="otro" data-i18n-option="auth.other"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reg-email" data-i18n="auth.email"></label>
                    <input type="email" id="reg-email" required class="input-field" data-i18n-placeholder="auth.contactPlaceholder">
                </div>
                <div class="form-group">
                    <label for="reg-password" data-i18n="auth.password"></label>
                    <input type="password" id="reg-password" required minlength="8" class="input-field" data-i18n-placeholder="auth.passwordPlaceholder">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;" data-i18n="auth.register.button"></button>
            </form>

            <p style="text-align: center; color: var(--text-muted); margin-top: 1.5rem; font-size: 0.85rem;">
                <span data-i18n="auth.hasAccount"></span> <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;"><span data-i18n="auth.loginHere"></span></a>
            </p>
        </div>
    </main>

    <footer><p data-i18n="landing.footer"></p></footer>

    <script type="module" src="js/main.js"></script>
</body></html>
