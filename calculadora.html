<!DOCTYPE html><html lang="es"><head>
  <script src="js/theme-bootstrap.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n-title="finance.title"></title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head>
<body><div class="app-layout"><aside id="app-sidebar" class="sidebar"></aside><div class="app-content"><header id="app-topbar" class="app-topbar"></header><main class="private-main">
<div class="app-head"><div><div class="page-eyebrow" data-i18n="finance.eyebrow"></div><h1 data-i18n="finance.title"></h1><p data-i18n="finance.subtitle"></p></div></div>
<section class="editor-grid"><div class="card editor-card"><div class="section-title"><h2 data-i18n="finance.params"></h2></div><div class="form-group"><label for="calc-currency" data-i18n="finance.currency"></label><select id="calc-currency" class="form-control"></select><div class="input-hint"><span data-i18n="finance.taxRate"></span>: <strong id="calc-tax-rate">21%</strong></div></div><div class="form-group"><label for="calc-objetivo" data-i18n="finance.goal"></label><input id="calc-objetivo" type="number" class="input-field" min="0" max="100" step="1" value="20"></div><div class="form-group"><label for="calc-horizonte" data-i18n="finance.horizon"></label><input id="calc-horizonte" type="number" class="input-field" min="1" max="120" step="1" value="12"></div><div class="form-group"><label for="calc-cushion" data-i18n="finance.cushion"></label><input id="calc-cushion" type="number" class="input-field" min="0" max="100" step="1" value="5"></div><p class="input-hint" data-i18n="finance.disclaimer"></p></div>
<div class="card editor-card"><div class="section-title"><h2 data-i18n="finance.estimate"></h2><span class="badge badge-neutral" id="calc-source"></span></div><div class="kpi-grid" style="margin:0"><div class="card"><div class="kpi-label" data-i18n="finance.income"></div><div class="kpi-value" id="res-ingresos">0,00 €</div></div><div class="card"><div class="kpi-label" data-i18n="finance.expenses"></div><div class="kpi-value" id="res-gastos">0,00 €</div></div><div class="card"><div class="kpi-label" data-i18n="finance.result"></div><div class="kpi-value" id="res-resultado">0,00 €</div></div><div class="card"><div class="kpi-label" data-i18n="finance.vat"></div><div class="kpi-value" id="res-iva">0,00 €</div></div><div class="card"><div class="kpi-label" data-i18n="finance.margin"></div><div class="kpi-value" id="res-margen">0,00 €</div></div><div class="card"><div class="kpi-label" data-i18n="finance.saving"></div><div class="kpi-value" id="res-ahorro">0,00 €</div></div></div><div class="section-title" style="margin-top:1.2rem"><h3 data-i18n="finance.projection"></h3></div><ul class="summary-list"><li><span class="muted" data-i18n="finance.savingTotal"></span><strong id="res-ahorro-total">0,00 €</strong></li><li><span class="muted" data-i18n="finance.taxCushion"></span><strong id="res-colchon">0,00 €</strong></li><li><span class="muted" data-i18n="finance.marginMonthly"></span><strong id="res-margen-mensual">0,00 €</strong></li></ul></div></section>
<div class="alert alert-ok" style="margin-top:1rem" data-i18n="finance.notice"></div>
</main></div></div><script type="module" src="js/main.js"></script><script type="module" src="js/calculadora.js"></script>
</body></html>
