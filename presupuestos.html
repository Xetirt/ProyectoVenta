<!DOCTYPE html><html lang="es"><head>
  <script src="js/theme-bootstrap.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n-title="billing.title"></title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head>
<body><div class="app-layout"><aside id="app-sidebar" class="sidebar"></aside><div class="app-content"><header id="app-topbar" class="app-topbar"></header><main class="private-main">
<div class="app-head"><div><div class="page-eyebrow" data-i18n="billing.eyebrow"></div><h1 data-i18n="billing.title"></h1><p data-i18n="billing.subtitle"></p></div></div>
<section class="editor-grid"><div class="card editor-card"><div class="section-title"><h2 id="editor-title" data-i18n="billing.new"></h2><span class="badge badge-neutral" id="editor-status">Borrador</span></div><div id="editor-feedback" hidden></div><form id="document-form">
<div class="form-grid-2"><div class="form-group"><label for="doc-kind" data-i18n="billing.document"></label><select id="doc-kind" class="form-control"><option value="PRESUPUESTO" data-i18n-option="billing.quote"></option><option value="FACTURA" data-i18n-option="billing.invoice"></option></select></div><div class="form-group"><label for="doc-operation" data-i18n="billing.operation"></label><select id="doc-operation" class="form-control"><option value="EMITIDA" data-i18n-option="billing.issuedIncome"></option><option value="RECIBIDA" data-i18n-option="billing.receivedExpense"></option></select><div class="input-hint" data-i18n="billing.operationHint"></div></div></div>
<div class="form-grid-3"><div class="form-group"><label for="doc-number" data-i18n="billing.number"></label><input id="doc-number" class="form-control" required></div><div class="form-group"><label for="issue-date" data-i18n="billing.issueDate"></label><input id="issue-date" type="date" class="form-control" required></div><div class="form-group"><label for="due-date" data-i18n="billing.dueDate"></label><input id="due-date" type="date" class="form-control"></div></div>
<div class="form-group"><label for="client-select" data-i18n="billing.savedParty"></label><select id="client-select" class="form-control"></select><div id="client-empty-state" hidden></div></div><div class="form-grid-2"><div class="form-group"><label for="client-name" data-i18n="billing.name"></label><input id="client-name" class="form-control" required></div><div class="form-group"><label for="client-tax" data-i18n="auth.taxId"></label><input id="client-tax" class="form-control" required></div></div><div class="form-grid-2"><div class="form-group"><label for="client-email" data-i18n="billing.email"></label><input id="client-email" type="email" class="form-control"></div><div class="form-group"><label for="client-address" data-i18n="billing.address"></label><input id="client-address" class="form-control"></div></div>
<div class="form-grid-4"><div class="form-group"><label for="tax-profile" data-i18n="billing.taxProfile"></label><select id="tax-profile" class="form-control"></select></div><div class="form-group"><label for="tax-region" data-i18n="billing.taxRegion"></label><input id="tax-region" class="form-control" placeholder="ES"></div><div class="form-group" id="tax-state-wrap" hidden><label for="tax-state" data-i18n="billing.usState"></label><select id="tax-state" class="form-control"></select></div><div class="form-group"><label for="currency" data-i18n="billing.currency"></label><select id="currency" class="form-control"></select></div></div><div class="form-group" id="fx-rate-wrap" hidden><label for="fx-rate">Tipo de cambio a moneda base</label><input id="fx-rate" class="form-control" type="number" min="0.000001" step="0.000001" value="1"></div>
<div class="form-group" id="custom-tax-wrap" hidden><label for="custom-tax-rate" data-i18n="billing.customTax"></label><input id="custom-tax-rate" class="form-control" type="number" min="0" max="100" step="0.01" value="0"></div>
<div class="form-grid-2"><div class="form-group"><label for="logo-url" data-i18n="billing.logo"></label><input id="logo-url" class="form-control" placeholder="https://..."></div><div class="form-group premium-field" data-premium-feature="profitMargin"><label for="internal-cost" data-i18n="margin.cost"></label><input id="internal-cost" class="form-control" type="number" min="0" step="0.01" value="0"><div class="input-hint" data-i18n="margin.private"></div></div></div>
<div class="form-group"><label data-i18n="billing.concepts"></label><div class="concept-list" id="concepts-list"></div><button type="button" class="btn-ghost" id="add-line" data-i18n="billing.addLine"></button></div>
<div class="form-grid-3"><div class="form-group"><label for="tax-rate" data-i18n="billing.tax"></label><select id="tax-rate" class="form-control"></select></div><div class="form-group"><label for="re-rate" data-i18n="billing.re"></label><select id="re-rate" class="form-control"></select><div class="input-hint" data-i18n="billing.reHint"></div></div><div class="form-group"><label for="irpf-rate" data-i18n="billing.irpf"></label><select id="irpf-rate" class="form-control"></select></div></div>
<div class="form-grid-2"><div class="form-group"><label for="doc-status" data-i18n="billing.statusSave"></label><select id="doc-status" class="form-control"></select></div><div class="form-group"><label for="payment-notes" data-i18n="billing.notes"></label><textarea id="payment-notes" class="form-control" rows="3"></textarea></div></div>
<label class="checkbox-container"><input id="terms" type="checkbox"><span data-i18n="billing.terms"></span></label><div class="btn-row" style="margin-top:1rem"><button type="submit" class="btn-primary" id="save-document" data-i18n="billing.save"></button><button type="button" class="btn-ghost" id="reset-document" data-i18n="billing.clear"></button></div><div id="internal-margin" class="internal-margin-box" hidden></div></form></div>
<div class="card editor-card editor-sticky"><div class="section-title"><h2 data-i18n="billing.preview"></h2><div class="btn-row"><span class="badge badge-success" id="preview-total-badge">0,00 €</span><button type="button" class="btn-ghost btn-small" id="print-document" data-i18n="billing.print"></button><button type="button" class="btn-ghost btn-small" id="export-pdf" data-i18n="pdf.export"></button><button type="button" class="btn-primary btn-small" id="share-quote" data-i18n="portal.share"></button></div></div><div class="preview-shell"><div class="paper-page" id="paper-preview"><div class="paper-header"><div><h2 class="doc-title" id="preview-title">PRESUPUESTO</h2><p class="muted" id="preview-number">Nº: P26-0001</p></div><div class="text-right"><img id="preview-logo" class="paper-logo" alt="Logo" hidden><p><span id="preview-date">—</span></p><p class="muted" id="preview-due">—</p></div></div><hr class="divider"><div class="paper-header"><div><strong data-i18n="billing.from"></strong><p id="preview-company" data-i18n="billing.company"></p><p class="muted" id="preview-company-tax" data-i18n="billing.taxIdShort"></p></div><div class="text-right"><strong data-i18n="billing.to"></strong><p id="preview-client" data-i18n="billing.customer"></p><p class="muted" id="preview-client-tax" data-i18n="billing.taxIdShort"></p></div></div><div class="table-responsive"><table class="preview-table"><thead><tr><th data-i18n="billing.concept"></th><th style="text-align:center" data-i18n="billing.units"></th><th style="text-align:right" data-i18n="billing.price"></th><th style="text-align:right" data-i18n="billing.total"></th></tr></thead><tbody id="preview-lines"></tbody></table></div><div class="totals-box"><div class="totals-row"><span data-i18n="billing.taxBase"></span><strong id="preview-base">0,00 €</strong></div><div class="totals-row"><span id="preview-tax-label">IVA (0%)</span><strong id="preview-iva">+0,00 €</strong></div><div class="totals-row" id="preview-re-row" hidden><span id="preview-re-label">RE</span><strong id="preview-re">+0,00 €</strong></div><div class="totals-row" id="preview-irpf-row" hidden><span id="preview-irpf-label">IRPF</span><strong id="preview-irpf">−0,00 €</strong></div><div class="totals-row total"><span data-i18n="billing.payable"></span><strong id="preview-total">0,00 €</strong></div></div><div class="paper-footer"><div class="paper-note" id="preview-notes">Notas / forma de pago</div><div class="muted" style="font-size:.68rem">GestioFlex</div></div></div></div></div></section>
<section class="card editor-card" style="margin-top:1rem"><div class="section-title"><div><h2 data-i18n="billing.history"></h2><p class="subtle" data-i18n="billing.historyHint"></p></div><select id="history-filter" class="form-control" style="max-width:220px"><option value="ALL" data-i18n-option="billing.all"></option><option value="FACTURA" data-i18n-option="billing.invoicesPlural"></option><option value="PRESUPUESTO" data-i18n-option="billing.quotesPlural"></option></select></div><div class="table-responsive"><table class="data-table responsive-cards"><thead><tr><th data-i18n="billing.issueDate"></th><th data-i18n="billing.number"></th><th data-i18n="billing.document"></th><th data-i18n="billing.name"></th><th data-i18n="billing.statusSave"></th><th data-i18n="billing.total"></th><th data-i18n="billing.actions"></th></tr></thead><tbody id="history-body"></tbody></table></div></section>
</main></div></div>
<script type="module" src="js/main.js"></script><script type="module" src="js/editor.js"></script>
</body></html>
