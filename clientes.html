<!DOCTYPE html><html lang="es"><head>
<script src="js/theme-bootstrap.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"><title data-i18n-title="crm.title"></title></head>
<body><div class="app-layout"><aside id="app-sidebar" class="sidebar"></aside><div class="app-content"><header id="app-topbar" class="app-topbar"></header><main class="private-main phase6-main">
<div class="app-head"><div><div class="page-eyebrow" data-i18n="crm.eyebrow"></div><h1 data-i18n="crm.title"></h1><p data-i18n="crm.subtitle"></p></div><div class="btn-row"><span id="crm-limit" class="badge badge-neutral"></span></div></div>
<section class="kpi-grid feature-kpis crm-kpis"><div class="card"><div class="kpi-label" data-i18n="crm.total"></div><div class="kpi-value" id="crm-total">0</div></div><div class="card"><div class="kpi-label" data-i18n="crm.risk"></div><div class="kpi-value" id="crm-risk">0</div></div><div class="card"><div class="kpi-label" data-i18n="crm.won"></div><div class="kpi-value" id="crm-won">0</div></div></section>
<section class="card crm-search-card"><div class="form-group crm-search-group"><label for="crm-search" data-i18n="crm.search"></label><input id="crm-search" type="search" class="form-control" data-i18n-placeholder="crm.searchPlaceholder" autocomplete="off"></div></section><section class="feature-grid crm-layout"><div class="card editor-card"><div class="section-title"><h2 data-i18n="crm.new"></h2></div>
<form id="crm-form"><div class="form-grid-2"><div class="form-group"><label for="crm-name" data-i18n="crm.name"></label><input id="crm-name" class="form-control" required></div><div class="form-group"><label for="crm-company" data-i18n="crm.company"></label><input id="crm-company" class="form-control"></div></div><div class="form-grid-2"><div class="form-group"><label for="crm-email" data-i18n="crm.email"></label><input id="crm-email" type="email" class="form-control"></div><div class="form-group"><label for="crm-value" data-i18n="crm.value"></label><input id="crm-value" type="number" min="0" step="0.01" value="0" class="form-control"></div></div><div class="form-grid-2"><div class="form-group"><label for="crm-stage" data-i18n="crm.stage"></label><select id="crm-stage" class="form-control"></select></div><div class="form-group"><label for="crm-tags" data-i18n="crm.tags"></label><input id="crm-tags" class="form-control" data-i18n-placeholder="crm.tagsPlaceholder"><small class="input-hint" data-i18n="crm.proTagHint"></small></div></div><div class="form-group"><label for="crm-note" data-i18n="crm.note"></label><textarea id="crm-note" class="form-control" rows="3"></textarea></div><button class="btn-primary" type="submit" data-i18n="crm.save"></button></form></div>
<div class="card kanban-card"><div class="kanban-board" id="crm-board"></div><p class="subtle" data-i18n="crm.dragHint"></p></div></section></main></div></div><script type="module" src="js/main.js"></script><script type="module" src="js/clientes.js"></script></body></html>
